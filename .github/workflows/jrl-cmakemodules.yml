name: CI - JRL-cmakemodules

on:
  push:
    branches:
      - devel
    paths-ignore:
      - 'doc/**'
      - '.gitlab-ci.yml'
      - '.gitignore'
      - '*.md'
      - 'LICENSE'
      - 'colcon.pkg'
      - '.pre-commit-config.yaml'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '.gitlab-ci.yml'
      - '.gitignore'
      - '*.md'
      - 'LICENSE'
      - 'colcon.pkg'
      - '.pre-commit-config.yaml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  with-submodules:
    name: Check configuration with git submodules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: |
          sudo apt-get update
          sudo apt-get install libboost-all-dev libeigen3-dev python3-numpy python3-scipy
          cmake .


  without-submodules:
    name: Check configuration without git submodules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          path: eigenpy
      - run: |
          sudo apt-get update
          sudo apt-get install libboost-all-dev libeigen3-dev python3-numpy python3-scipy
          cmake -B build -S eigenpy
          grep -qvz CMAKE_PROJECT_VERSION:STATIC=0.0 build/CMakeCache.txt
