name: CI - Linux (APT)

on:
  push:
    branches:
      - devel
    paths-ignore:
      - "doc/**"
      - ".gitlab-ci.yml"
      - ".gitignore"
      - "*.md"
      - "LICENSE"
      - "colcon.pkg"
      - ".pre-commit-config.yaml"
  pull_request:
    paths-ignore:
      - "doc/**"
      - ".gitlab-ci.yml"
      - ".gitignore"
      - "*.md"
      - "LICENSE"
      - "colcon.pkg"
      - ".pre-commit-config.yaml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: CI - ${{ matrix.image }} - ${{ matrix.build_type }} (APT)
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04"]
        build_type: [Release, Debug]
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 6
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Install dependencies via APT
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
          git \
          g++ \
          cmake \
          ninja-build \
          ccache \
          doxygen \
          graphviz \
          libboost-all-dev \
          libeigen3-dev \
          python3-numpy \
          python3-dev \
          python3-scipy

      - uses: actions/checkout@v7

      - name: Setup ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ubuntu-${{ matrix.image }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: ccache-ubuntu-${{ matrix.image }}-${{ matrix.build_type }}-

      - name: Clear ccache stats
        run: ccache --show-stats --zero-stats --verbose

      - name: CMake Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_TESTING_SCIPY=ON

      - name: CMake Build
        run: cmake --build build --verbose --parallel 2

      - name: Show ccache stats
        run: ccache --show-stats --verbose

      - name: CTest
        run: ctest --test-dir build --output-on-failure

      - name: CMake Install
        run: cmake --install build --prefix install

  check:
    if: always()
    name: check-linux

    needs:
      - ubuntu

    runs-on: Ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
